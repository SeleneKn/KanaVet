!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dra. Kana | Pulsos</title>
  <link rel="icon" href="data:image/svg+xml, <svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">


  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <!-- Estilos personalizados (se mantienen intactos) -->
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/pulsos.css">

</head>
<body class="relative overflow-x-hidden">

  <!-- Background Paw Pattern Overlay -->
<div class="paw-bg"></div>


<body class="relative overflow-x-hidden">

  <div class="paw-bg"></div>
  <div id="menuContainer"></div>

  <div id="pulsos-page-wrapper">
  
      
      <div class="pulsos-container">
          <div class="calculator-card text-center">
              
              <div class="header">
                  <h1>💓 Contador de Pulsos</h1>
                  <p>Toca el corazón para registrar cada latido de tu michi 🐾</p>
              </div>

              <!-- Círculo del Contador -->
              <div class="pulse-circle-wrapper">
                  <button id="pulseBtn" class="pulse-circle">
                      <i class="fas fa-heart"></i>
                  </button>
              </div>

              <!-- Resultados -->
              <div class="counter-display mb-4">
                  <h2 id="pulseCount">0</h2>
                  <p>Pulsos registrados</p>
              </div>

              <!-- NUEVO: Panel del Cronómetro -->
              <div class="timer-panel">
                  <div class="timer-item">
                      <i class="fas fa-stopwatch"></i>
                      <span id="timerDisplay">00:00</span>
                  </div>
                  <div class="timer-divider"></div>
                  <div class="timer-item">
                      <i class="fas fa-heartbeat"></i>
                      <span id="bpmDisplay">0 PPM</span>
                  </div>
              </div>

              <!-- Botón para reiniciar -->
              <button id="resetBtn" class="btn-reset mt-4">
                  <i class="fas fa-redo"></i> Reiniciar Contador
              </button>

          </div>
      </div>
  </div>











    
  <!-- ============ FOOTER ============ -->
   <div id="footerContainer"></div>
 <!-- ============ AUDIO ============ -->
    <audio id="bgMusic" loop>
  <source src="../audio/snoozybeats-cat-cafe-lofi-309576.mp3" type="audio/mpeg">
 </audio>

  <!-- Bootstrap 5 JS Bundle (incluye Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS personalizado (efectos, sonido, tema, etc.) -->
  <script src="../js/main.js"></script>
  <script src="../js/cronometro.js"></script>


</body>
</html>
