    <body class="relative overflow-x-hidden">

  <div class="paw-bg"></div>

  <!-- ENCABEZADO / BARRA DE NAVEGACIÓN -->
  <div id="menuContainer"></div>
    <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver a la página principal</a>

  <!-- CONTENIDO DE GRIMACE -->
  <div id="grimace-page-wrapper">
      
      
      <div class="grimace-container">
          <div class="grimace-card">
              
              <div class="header">
                  <h1>😾 Feline Grimace Scale (Dolor Felino)</h1>
              </div>

              <form id="grimaceForm">
                  <!-- 1. Orejas -->
                  <div class="form-group">
                      <label for="orejas">1. Posición de las Orejas:</label>
                      <select id="orejas">
                          <option value="0">0 - Orejas hacia adelante (Normal)</option>
                          <option value="1">1 - Orejas ligeramente aplanadas</option>
                          <option value="2">2 - Orejas completamente aplanadas / giradas</option>
                      </select>
                  </div>

                  <!-- 2. Ojos -->
                  <div class="form-group">
                      <label for="ojos">2. Estrechamiento de Ojos:</label>
                      <select id="ojos">
                          <option value="0">0 - Ojos abiertos</option>
                          <option value="1">1 - Ojos parcialmente cerrados</option>
                          <option value="2">2 - Ojos fuertemente cerrados / entrecerrados</option>
                      </select>
                  </div>

                  <!-- 3. Hocico -->
                  <div class="form-group">
                      <label for="hocico">3. Tensión del Hocico:</label>
                      <select id="hocico">
                          <option value="0">0 - Relajado (Redondeado)</option>
                          <option value="1">1 - Ligeramente tenso</option>
                          <option value="2">2 - Muy tenso (Ovalado / Estirado)</option>
                      </select>
                  </div>

                  <button type="button" class="btn-evaluar" id="btnEvaluar">
                      Evaluar Dolor
                  </button>
              </form>

              <!-- Resultados (Oculto por defecto) -->
              <div class="result-box" id="resultBox">
                  <h3 id="resultadoTitulo">Resultado de la Evaluación</h3>
                  <p>Puntaje total: <strong id="totalPuntos">0</strong> / 6</p>
                  <div id="alertaDolor" class="alert-message"></div>
              </div>

          </div>
      </div>
  </div>
