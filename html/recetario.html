<body class="relative overflow-x-hidden">

  <!-- Background Paw Pattern Overlay -->
  <div class="paw-bg"></div>

  <!-- ENCABEZADO / BARRA DE NAVEGACIÓN -->
  <div id="menuContainer"></div>

  <!-- CONTENIDO DE LA RECETA -->
  <div id="recetas-page-wrapper">
     
      
      <div class="recetas-container">
          <div class="receta-card">
              
              <!-- Encabezado de la Receta -->
              <div class="receta-header">
                  <h1>🐾 Dra. Araceli Kanagusico</h1>
                  <p>Especialista en Medicina Felina</p>
              </div>
              
              <div class="divider-dashed"></div>

              <!-- Formulario -->
              <form id="recetaForm">
                  <div class="form-group">
                      <label for="nombreGato">Nombre del Paciente (Gato):</label>
                      <input type="text" id="nombreGato" placeholder="Ej. Misha" required>
                  </div>

                  <div class="form-group">
                      <label for="nombreTutor">Nombre del Tutor:</label>
                      <input type="text" id="nombreTutor" placeholder="Ej. Carlos Pérez" required>
                  </div>

                  <div class="form-group">
                      <label for="indicaciones">Indicaciones y Medicamentos:</label>
                      <textarea id="indicaciones" rows="5" placeholder="Escribe aquí el tratamiento prescrito..." required></textarea>
                  </div>
              </form>

              <!-- Botones de Acción -->
              <div class="acciones-grid">
                  <button type="button" id="btnImprimir" class="btn-receta btn-print">
                      <i class="fas fa-print"></i> Imprimir Receta
                  </button>
                  
                  <button type="button" id="btnWhatsapp" class="btn-receta btn-whatsapp">
                      <i class="fab fa-whatsapp"></i> WhatsApp
                  </button>
                  
                  <button type="button" id="btnCorreo" class="btn-receta btn-email">
                      <i class="fas fa-envelope"></i> Correo
                  </button>
              </div>

          </div>
      </div>
  </div>











    
  <!-- ============ FOOTER ============ -->
   <div id="footerContainer"></div>
