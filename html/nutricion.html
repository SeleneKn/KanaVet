    <body class="relative overflow-x-hidden">

  <!-- Background Paw Pattern Overlay -->
  <div class="paw-bg"></div>

  <!-- ENCABEZADO / BARRA DE NAVEGACIÓN -->
  <div id="menuContainer"></div>

  <!-- CONTENIDO DE NUTRICIÓN -->
  <div id="nutricion-page-wrapper">
     
      
      <div class="nutricion-container">
          <div class="nutricion-card">
              
              <div class="header">
                  <h1>🥗 Nutrición y Calorías Felinas</h1>
              </div>

              <form id="nutricionForm">
                  <div class="form-group">
                      <label for="pesoGato">Peso del Gato (kg):</label>
                      <input type="number" id="pesoGato" step="0.1" placeholder="Ej. 4.5" required>
                  </div>

                  <div class="form-group">
                      <label for="estadoGato">Estado del paciente:</label>
                      <select id="estadoGato" required>
                          <option value="esterilizado">Gato adulto esterilizado</option>
                          <option value="entero">Gato adulto entero</option>
                          <option value="cachorro">Gatito (menor a 1 año)</option>
                          <option value="obesidad">Propenso a obesidad</option>
                          <option value="perdida">Pérdida de peso</option>
                          <option value="gestacion">Gestación / Lactancia</option>
                      </select>
                  </div>

                  <button type="button" class="btn-calcular" id="btnCalcular">
                      Calcular Calorías Diarias
                  </button>
              </form>

              <!-- Resultados (Oculto por defecto) -->
              <div class="result-box" id="resultBox">
                  <h3>Requerimiento Diario</h3>
                  <p>Calorías necesarias: <strong id="totalKcal">0</strong> kcal/día</p>
                  <p style="font-size: 0.85rem; color: #7A6B6B; margin-top: 10px;" id="notaResultado"></p>
              </div>

          </div>
      </div>
  </div>
